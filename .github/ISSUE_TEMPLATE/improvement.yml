name: Improvement or provider compatibility
description: Suggest a practical improvement to an existing RhinoSpatial workflow.
body:
  - type: textarea
    id: workflow
    attributes:
      label: Workflow and problem
      description: What are you trying to do, and what is difficult or unsupported today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the useful outcome. Include a public provider URL or sample when relevant.
    validations:
      required: true
