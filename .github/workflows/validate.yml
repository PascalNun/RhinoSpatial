name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    defaults:
      run:
        shell: bash
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            7.0.x
            10.0.x

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Restore
        run: dotnet restore RhinoSpatial.sln

      - name: Build
        run: dotnet build RhinoSpatial.sln -c Release --no-restore

      - name: Check OGC requests
        run: dotnet run --project RhinoSpatial.Sandbox.csproj -c Release --no-build -- ogc-request-check

      - name: Check reference sources
        run: dotnet run --project RhinoSpatial.Sandbox.csproj -c Release --no-build -- reference-source-check

      - name: Check source readers
        run: dotnet run --project RhinoSpatial.Sandbox.csproj -c Release --no-build -- source-reader-check

      - name: Check terrain meshes
        run: dotnet run --project RhinoSpatial.Sandbox.csproj -c Release --no-build -- terrain-mesh-check

      - name: Check correctness regressions
        run: dotnet run --project RhinoSpatial.Sandbox.csproj -c Release --no-build -- correctness-check

      - name: Check service reliability
        run: dotnet run --project RhinoSpatial.Sandbox.csproj -c Release --no-build -- reliability-check

      - name: Check ATOM downloads and cache
        run: dotnet run --project RhinoSpatial.Sandbox.csproj -c Release --no-build -- lod2-atom-check

      - name: Check source compatibility
        run: dotnet run --project RhinoSpatial.Sandbox.csproj -c Release --no-build -- source-compatibility-check

      - name: Check medium-priority compatibility
        run: dotnet run --project RhinoSpatial.Sandbox.csproj -c Release --no-build -- medium-compatibility-check

      - name: Check low-priority compatibility
        run: dotnet run --project RhinoSpatial.Sandbox.csproj -c Release --no-build -- low-compatibility-check

      - name: Check 3D Tiles selection
        run: dotnet run --project RhinoSpatial.Sandbox.csproj -c Release --no-build -- tiles-selection-check

      - name: Validate source catalogue JSON
        run: python -m json.tool examples/sources.json >/dev/null
