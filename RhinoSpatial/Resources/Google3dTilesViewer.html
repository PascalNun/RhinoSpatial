<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RhinoSpatial Google 3D Tiles Runtime</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/": "https://cdn.jsdelivr.net/npm/three@0.170.0/"
        }
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #10151d;
        color: #f5f7fb;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }

      #runtimeCanvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .panel {
        position: absolute;
        left: 14px;
        right: 14px;
        z-index: 10;
        max-width: 620px;
        display: grid;
        gap: 8px;
        padding: 12px 14px;
        border-radius: 14px;
        background: rgba(14, 20, 28, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(16px);
      }

      .topbar {
        top: 14px;
      }

      .footer {
        left: 14px;
        bottom: 14px;
        right: auto;
        width: min(420px, calc(100% - 28px));
      }

      .title {
        font-size: 15px;
        font-weight: 700;
      }

      .note,
      .status,
      .metrics,
      .footer-note {
        font-size: 12px;
        line-height: 1.45;
      }

      .note,
      .footer-note {
        color: rgba(245, 247, 251, 0.8);
      }

      .status {
        color: #a6d8ff;
      }

      .metrics {
        color: rgba(245, 247, 251, 0.9);
      }

      .attribution {
        font-size: 12px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="runtimeCanvas"></canvas>

      <div class="panel topbar">
        <div class="title">Google 3D Tiles Runtime</div>
        <div class="note">
          This runtime decodes Google Photorealistic 3D Tiles for RhinoSpatial’s transient Rhino viewport reference. The tiles remain reference-only: no bake, no export, no offline geometry ownership.
        </div>
        <div id="status" class="status">Loading runtime configuration...</div>
        <div id="metrics" class="metrics"></div>
      </div>

      <div class="panel footer">
        <div id="attributionLabel" class="attribution">Google Maps</div>
        <div id="usageNote" class="footer-note"></div>
      </div>
    </div>

    <script>
      window.__setRuntimeStatus = (message) => {
        const statusElement = document.getElementById("status");
        if (statusElement) {
          statusElement.textContent = message;
        }
      };

      window.__postRuntimeStatus = async (ownerId, message) => {
        if (!ownerId || !message) {
          return;
        }

        try {
          await fetch("/api/runtime-status", {
            method: "POST",
            cache: "no-store",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              ownerId,
              status: message,
            }),
          });
        } catch (error) {
          console.error("Could not post runtime status", error);
        }
      };

      window.addEventListener("error", (event) => {
        const message = event?.message || "The Google 3D Tiles runtime failed before it could initialize.";
        window.__setRuntimeStatus(message);
        window.__postRuntimeStatus(window.__rhinoSpatialOwnerId || "", message);
      });

      window.addEventListener("unhandledrejection", (event) => {
        const reason = event?.reason;
        const message =
          reason?.message ||
          (typeof reason === "string" ? reason : "The Google 3D Tiles runtime hit an unhandled async error.");
        window.__setRuntimeStatus(message);
        window.__postRuntimeStatus(window.__rhinoSpatialOwnerId || "", message);
      });
    </script>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";
      import { TilesRenderer, WGS84_ELLIPSOID } from "https://cdn.jsdelivr.net/npm/3d-tiles-renderer@0.4.21/build/index.three.js";
      import { LoadRegionPlugin, SphereRegion } from "https://cdn.jsdelivr.net/npm/3d-tiles-renderer@0.4.21/build/index.three-plugins.js";

      const statusElement = document.getElementById("status");
      const metricsElement = document.getElementById("metrics");
      const usageNoteElement = document.getElementById("usageNote");
      const attributionLabelElement = document.getElementById("attributionLabel");
      const canvas = document.getElementById("runtimeCanvas");

      let lastMeshSignature = "";
      let lastPostedAt = 0;
      let runtimeDirty = true;
      let exportInFlight = false;
      let activeGoogleSession = "";
      const textureSamplerCache = new WeakMap();
      const loadedTileDescriptors = new Map();

      function setStatus(message) {
        statusElement.textContent = message;
      }

      function setMetrics(message) {
        metricsElement.textContent = message || "";
      }

      function parseBoundingBox(text) {
        if (!text) return null;
        const values = text.split(",").map(Number);
        if (values.length !== 4 || values.some((value) => !Number.isFinite(value))) {
          return null;
        }

        return {
          minLon: values[0],
          minLat: values[1],
          maxLon: values[2],
          maxLat: values[3],
        };
      }

      function degreesToRadians(value) {
        return (value * Math.PI) / 180.0;
      }

      function getGoogleSession(url) {
        if (!url || !url.searchParams) {
          return "";
        }

        return url.searchParams.get("session") || "";
      }

      function buildGoogleTilesUrl(urlLike, apiKey, fallbackSession = "") {
        let url;

        if (typeof urlLike === "string" && urlLike.startsWith("/v1/3dtiles/")) {
          url = new URL(`https://tile.googleapis.com${urlLike}`);
        } else {
          url = new URL(urlLike, window.location.href);
        }

        if (url.hostname === "tile.googleapis.com" && apiKey && !url.searchParams.has("key")) {
          url.searchParams.set("key", apiKey);
        }

        if (
          url.hostname === "tile.googleapis.com" &&
          fallbackSession &&
          !url.searchParams.has("session") &&
          url.pathname.startsWith("/v1/3dtiles/datasets/")
        ) {
          url.searchParams.set("session", fallbackSession);
        }

        return url;
      }

      function installGoogleFetchBridge(apiKey, ownerId) {
        const originalFetch = window.fetch.bind(window);

        window.fetch = async (input, init) => {
          let requestUrl = input;
          let method = "GET";

          if (input instanceof Request) {
            requestUrl = input.url;
            method = input.method || method;
          } else if (init && init.method) {
            method = init.method;
          }

          let resolvedInput = input;

          try {
            const googleUrl = buildGoogleTilesUrl(requestUrl, apiKey, activeGoogleSession);
            if (googleUrl.hostname === "tile.googleapis.com") {
              const requestSession = getGoogleSession(googleUrl);
              if (requestSession) {
                activeGoogleSession = requestSession;
              }

              if (input instanceof Request) {
                resolvedInput = new Request(googleUrl.toString(), input);
              } else {
                resolvedInput = googleUrl.toString();
              }
            }
          } catch (error) {
            console.error("Could not normalize Google tile URL", error);
          }

          const response = await originalFetch(resolvedInput, init);

          try {
            const responseUrl = typeof resolvedInput === "string"
              ? resolvedInput
              : resolvedInput instanceof Request
                ? resolvedInput.url
                : String(resolvedInput);
            const parsedUrl = buildGoogleTilesUrl(responseUrl, apiKey, activeGoogleSession);
            const responseSession = getGoogleSession(parsedUrl);
            if (responseSession) {
              activeGoogleSession = responseSession;
            }

            if (parsedUrl.hostname === "tile.googleapis.com" && !response.ok) {
              const sessionState = parsedUrl.searchParams.has("session") ? "session=present" : "session=missing";
              const keyState = parsedUrl.searchParams.has("key") ? "key=present" : "key=missing";
              const statusMessage = `Google tile request failed (${response.status}) for ${method} ${parsedUrl.pathname} (${sessionState}, ${keyState})`;
              window.__setRuntimeStatus(statusMessage);
              window.__postRuntimeStatus(ownerId, statusMessage);
            }
          } catch (error) {
            console.error("Could not inspect Google tile response", error);
          }

          return response;
        };
      }

      function estimateAreaSizeMeters(bbox) {
        const latCenter = degreesToRadians((bbox.minLat + bbox.maxLat) * 0.5);
        const metersPerDegreeLat =
          111132.92 -
          559.82 * Math.cos(2 * latCenter) +
          1.175 * Math.cos(4 * latCenter);
        const metersPerDegreeLon =
          111412.84 * Math.cos(latCenter) -
          93.5 * Math.cos(3 * latCenter);

        const widthMeters = Math.max(10.0, Math.abs(bbox.maxLon - bbox.minLon) * metersPerDegreeLon);
        const heightMeters = Math.max(10.0, Math.abs(bbox.maxLat - bbox.minLat) * metersPerDegreeLat);
        return Math.max(widthMeters, heightMeters);
      }

      async function loadConfig() {
        const response = await fetch("/api/config", { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Could not load runtime configuration (${response.status}).`);
        }

        return response.json();
      }

      function markRuntimeDirty() {
        runtimeDirty = true;
      }

      function clamp01(value) {
        return Math.min(1, Math.max(0, value));
      }

      function getTextureSampler(texture) {
        if (!texture || !texture.image) {
          return null;
        }

        if (textureSamplerCache.has(texture)) {
          return textureSamplerCache.get(texture);
        }

        const image = texture.image;
        const width = image.naturalWidth || image.videoWidth || image.width || 0;
        const height = image.naturalHeight || image.videoHeight || image.height || 0;
        if (width <= 0 || height <= 0) {
          textureSamplerCache.set(texture, null);
          return null;
        }

        const sampleCanvas = document.createElement("canvas");
        sampleCanvas.width = width;
        sampleCanvas.height = height;
        const context = sampleCanvas.getContext("2d", { willReadFrequently: true });
        if (!context) {
          textureSamplerCache.set(texture, null);
          return null;
        }

        try {
          context.drawImage(image, 0, 0, width, height);
          const pixelData = context.getImageData(0, 0, width, height).data;
          const sampler = (u, v) => {
            const uu = clamp01(u);
            const vv = clamp01(v);
            const x = Math.min(width - 1, Math.max(0, Math.round(uu * (width - 1))));
            const y = Math.min(height - 1, Math.max(0, Math.round((1.0 - vv) * (height - 1))));
            const offset = ((y * width) + x) * 4;
            return [
              pixelData[offset],
              pixelData[offset + 1],
              pixelData[offset + 2],
              pixelData[offset + 3],
            ];
          };

          textureSamplerCache.set(texture, sampler);
          return sampler;
        } catch (error) {
          console.warn("Could not sample Google tile texture image.", error);
          textureSamplerCache.set(texture, null);
          return null;
        }
      }

      function getMaterialColor(material) {
        const color = material?.color;
        if (!color) {
          return [180, 180, 180];
        }

        return [
          Math.round(clamp01(color.r) * 255),
          Math.round(clamp01(color.g) * 255),
          Math.round(clamp01(color.b) * 255),
        ];
      }

      function getVertexColorBytes(object, geometry) {
        const positionAttribute = geometry.getAttribute("position");
        if (!positionAttribute) {
          return [];
        }

        const colorAttribute = geometry.getAttribute("color");
        if (colorAttribute && colorAttribute.count === positionAttribute.count) {
          const colors = [];
          for (let i = 0; i < colorAttribute.count; i++) {
            colors.push(
              Math.round(clamp01(colorAttribute.getX(i)) * 255),
              Math.round(clamp01(colorAttribute.getY(i)) * 255),
              Math.round(clamp01(colorAttribute.getZ(i)) * 255)
            );
          }

          return colors;
        }

        const material = Array.isArray(object.material) ? object.material[0] : object.material;
        const uvAttribute = geometry.getAttribute("uv");
        const texture = material?.map || material?.emissiveMap || null;
        const textureSampler = uvAttribute ? getTextureSampler(texture) : null;
        const fallbackColor = getMaterialColor(material);
        const colors = [];

        for (let i = 0; i < positionAttribute.count; i++) {
          if (textureSampler && uvAttribute && uvAttribute.count > i) {
            const uv = new THREE.Vector2(uvAttribute.getX(i), uvAttribute.getY(i));
            if (texture && typeof texture.transformUv === "function") {
              texture.transformUv(uv);
            }

            const sampled = textureSampler(uv.x, uv.y);
            if (sampled) {
              colors.push(sampled[0], sampled[1], sampled[2]);
              continue;
            }
          }

          colors.push(fallbackColor[0], fallbackColor[1], fallbackColor[2]);
        }

        return colors;
      }

      function getWorldMeshPayload(root) {
        const meshes = [];
        let meshCount = 0;
        let triangleCount = 0;
        let vertexCount = 0;
        const maxMeshes = 80;
        const maxTriangles = 220000;
        const tempVector = new THREE.Vector3();

        root.updateMatrixWorld(true);

        root.traverse((object) => {
          if (meshCount >= maxMeshes || triangleCount >= maxTriangles) {
            return;
          }

          if (!object.visible || !object.isMesh || !object.geometry) {
            return;
          }

          const geometry = object.geometry;
          const positionAttribute = geometry.getAttribute("position");
          if (!positionAttribute || positionAttribute.count < 3) {
            return;
          }

          const indexArray = geometry.index ? Array.from(geometry.index.array) : null;
          const primitiveTriangleCount = indexArray
            ? Math.floor(indexArray.length / 3)
            : Math.floor(positionAttribute.count / 3);

          if (primitiveTriangleCount <= 0) {
            return;
          }

          if (triangleCount + primitiveTriangleCount > maxTriangles && meshCount > 0) {
            return;
          }

          const positions = [];
          const colors = getVertexColorBytes(object, geometry);
          for (let i = 0; i < positionAttribute.count; i++) {
            tempVector.fromBufferAttribute(positionAttribute, i);
            tempVector.applyMatrix4(object.matrixWorld);
            positions.push(
              Math.round(tempVector.x * 1000) / 1000,
              Math.round(tempVector.y * 1000) / 1000,
              Math.round(tempVector.z * 1000) / 1000
            );
          }

          const indices = indexArray
            ? indexArray.map((value) => Number(value))
            : Array.from({ length: positionAttribute.count }, (_, value) => value);

          meshes.push({
            name: object.name || `mesh-${meshCount + 1}`,
            positions,
            indices,
            colors,
          });

          meshCount += 1;
          triangleCount += primitiveTriangleCount;
          vertexCount += positionAttribute.count;
        });

        return { meshes, meshCount, triangleCount, vertexCount };
      }

      async function postMeshBatch(ownerId, status, meshes) {
        const response = await fetch("/api/mesh-batch", {
          method: "POST",
          cache: "no-store",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            ownerId,
            status,
            meshes,
          }),
        });

        if (!response.ok) {
          throw new Error(`Rhino mesh bridge rejected the batch (${response.status}).`);
        }

        return response.json();
      }

      async function postTileBatch(ownerId, status, tileUrls) {
        const response = await fetch("/api/tile-batch", {
          method: "POST",
          cache: "no-store",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            ownerId,
            status,
            tiles: tileUrls,
          }),
        });

        if (!response.ok) {
          throw new Error(`Rhino tile bridge rejected the batch (${response.status}).`);
        }

        return response.json();
      }

      function getTileContentUri(tile) {
        return (
          tile?.content?.uri ||
          tile?.content?.url ||
          tile?.uri ||
          tile?.cached?.uri ||
          tile?.cached?.url ||
          ""
        );
      }

      function buildLoadedTileDescriptor(tile, scene, apiKey) {
        const contentUri = getTileContentUri(tile);
        if (!contentUri) {
          return null;
        }

        const normalizedUrl = buildGoogleTilesUrl(contentUri, apiKey, activeGoogleSession).toString();
        if (!normalizedUrl.toLowerCase().includes(".glb")) {
          return null;
        }

        scene.updateMatrixWorld(true);
        const transform = Array.from(scene.matrixWorld.elements || []).map((value) =>
          Math.round(Number(value) * 1_000_000) / 1_000_000
        );

        return {
          key: scene?.uuid || normalizedUrl,
          url: normalizedUrl,
          transform,
        };
      }

      async function initRuntime() {
        try {
          const config = await loadConfig();
          window.__rhinoSpatialOwnerId = config.ownerId || "";
          usageNoteElement.textContent = config.usageNote || "";
          attributionLabelElement.textContent = config.attributionText || "Google Maps";
          await window.__postRuntimeStatus(config.ownerId, "Google 3D Tiles runtime window opened.");

          if (!config.ownerId) {
            setStatus("No active component session is available yet. Recompute the Grasshopper component and try again.");
            return;
          }

          if (!config.apiKey) {
            setStatus("No API key is configured. Go back to Grasshopper, connect your user-managed Google Maps API key, and enable the reference again.");
            return;
          }

          installGoogleFetchBridge(config.apiKey, config.ownerId);
          await window.__postRuntimeStatus(config.ownerId, "Google tile fetch bridge installed.");

          const bbox = parseBoundingBox(config.boundingBox4326);
          if (!bbox) {
            setStatus("No valid EPSG:4326 study area is available. Recompute the component with a valid Spatial Context.");
            return;
          }

          const scene = new THREE.Scene();
          scene.background = new THREE.Color("#10151d");
          await window.__postRuntimeStatus(config.ownerId, "Google 3D Tiles runtime initialized the Three.js scene.");

          const renderer = new THREE.WebGLRenderer({
            canvas,
            antialias: true,
            powerPreference: "high-performance",
          });
          await window.__postRuntimeStatus(config.ownerId, "Google 3D Tiles runtime initialized the WebGL renderer.");
          renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
          renderer.setSize(window.innerWidth, window.innerHeight, false);

          const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 1.0, 30000000.0);

          const centerLatDeg = (bbox.minLat + bbox.maxLat) * 0.5;
          const centerLonDeg = (bbox.minLon + bbox.maxLon) * 0.5;
          const centerLat = degreesToRadians(centerLatDeg);
          const centerLon = degreesToRadians(centerLonDeg);
          const areaSizeMeters = estimateAreaSizeMeters(bbox);

          const center = new THREE.Vector3();
          const up = new THREE.Vector3();
          WGS84_ELLIPSOID.getCartographicToPosition(centerLat, centerLon, 0, center);
          WGS84_ELLIPSOID.getCartographicToNormal(centerLat, centerLon, up);

          const east = new THREE.Vector3(-Math.sin(centerLon), Math.cos(centerLon), 0).normalize();
          const north = new THREE.Vector3().crossVectors(up, east).normalize();

          camera.position
            .copy(center)
            .addScaledVector(up, Math.max(350.0, areaSizeMeters * 1.6))
            .addScaledVector(north, areaSizeMeters * 0.5)
            .addScaledVector(east, areaSizeMeters * 0.18);
          camera.up.copy(up);
          camera.lookAt(center);
          camera.updateMatrixWorld();

          const ambientLight = new THREE.AmbientLight(0xffffff, 1.25);
          scene.add(ambientLight);
          const directionalLight = new THREE.DirectionalLight(0xffffff, 1.8);
          directionalLight.position.copy(up).add(east).add(north).multiplyScalar(4000.0);
          scene.add(directionalLight);
          await window.__postRuntimeStatus(config.ownerId, "Google 3D Tiles runtime initialized the scene camera and lighting.");

          const tiles = new TilesRenderer(
            `https://tile.googleapis.com/v1/3dtiles/root.json?key=${encodeURIComponent(config.apiKey)}`
          );
          tiles.errorTarget = 8;
          tiles.fetchOptions = { mode: "cors", cache: "default" };
          tiles.setCamera(camera);
          tiles.setResolutionFromRenderer(camera, renderer);

          const loadRegionPlugin = new LoadRegionPlugin();
          tiles.registerPlugin(loadRegionPlugin);
          loadRegionPlugin.addRegion(
            new SphereRegion({
              sphere: new THREE.Sphere(center.clone(), Math.max(180.0, areaSizeMeters * 1.4)),
              errorTarget: 4,
              mask: true,
            })
          );

          scene.add(tiles.group);

          tiles.addEventListener("load-root-tileset", () => {
            markRuntimeDirty();
            setStatus("Google 3D Tiles runtime connected. Loading transient meshes for the selected RhinoSpatial area...");
            window.__postRuntimeStatus(config.ownerId, "Google 3D Tiles root tileset loaded. Waiting for visible tile meshes...");
          });

          tiles.addEventListener("load-model", (event) => {
            const descriptor = buildLoadedTileDescriptor(event?.tile, event?.scene, config.apiKey);
            if (descriptor) {
              loadedTileDescriptors.set(descriptor.key, {
                url: descriptor.url,
                transform: descriptor.transform,
              });
              markRuntimeDirty();
            }
          });

          tiles.addEventListener("dispose-model", (event) => {
            const key = event?.scene?.uuid;
            if (key && loadedTileDescriptors.delete(key)) {
              markRuntimeDirty();
            }
          });

          window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight, false);
            tiles.setResolutionFromRenderer(camera, renderer);
            markRuntimeDirty();
          });

          async function maybePushRuntimeMeshes(force = false) {
            const now = performance.now();
            if (exportInFlight) {
              return;
            }

            if (!force && !runtimeDirty && now - lastPostedAt < 3500) {
              return;
            }

            const tileDescriptors = Array.from(loadedTileDescriptors.values()).sort((a, b) =>
              a.url.localeCompare(b.url)
            );
            const signature = JSON.stringify(tileDescriptors);

            if (!force && signature === lastMeshSignature && now - lastPostedAt < 3500) {
              return;
            }

            exportInFlight = true;
            try {
              lastMeshSignature = signature;
              lastPostedAt = now;
              runtimeDirty = false;

              const runtimeStatus = tileDescriptors.length > 0
                ? `Google 3D Tiles reference active in Rhino: ${tileDescriptors.length} streamed tile models ready for Rhino decoding.`
                : `Google 3D Tiles runtime is connected, but no tile meshes are loaded for the selected area yet.${activeGoogleSession ? " Session active." : ""}`;

              await postTileBatch(config.ownerId, runtimeStatus, tileDescriptors);
              setMetrics(
                tileDescriptors.length > 0
                  ? `${tileDescriptors.length} tile models handed to Rhino for decoding`
                  : "Waiting for visible tile meshes in the selected area"
              );
              await window.__postRuntimeStatus(config.ownerId, runtimeStatus);
            } catch (error) {
              console.error(error);
              setStatus(error.message || "Rhino mesh bridge failed while streaming tile meshes.");
              await window.__postRuntimeStatus(
                config.ownerId,
                error?.message || "Rhino mesh bridge failed while streaming tile meshes."
              );
            } finally {
              exportInFlight = false;
            }
          }

          function renderLoop() {
            requestAnimationFrame(renderLoop);
            camera.updateMatrixWorld();
            tiles.update();
            renderer.render(scene, camera);
            maybePushRuntimeMeshes(false);
          }

          setStatus(config.statusNote || "Starting Google 3D Tiles runtime...");
          await window.__postRuntimeStatus(config.ownerId, config.statusNote || "Starting Google 3D Tiles runtime...");
          renderLoop();
          await maybePushRuntimeMeshes(true);
        } catch (error) {
          console.error(error);
          setStatus(error.message || "The Google 3D Tiles runtime could not be initialized.");
          await window.__postRuntimeStatus(
            window.__rhinoSpatialOwnerId || "",
            error?.message || "The Google 3D Tiles runtime could not be initialized."
          );
        }
      }

      initRuntime();
    </script>
  </body>
</html>
